server {
    listen 80;
    # IPv6 explicito. A imagem oficial tem um script de entrypoint que
    # acrescentaria esta linha sozinho, mas ele so mexe na configuracao
    # empacotada -- com a nossa ele registra "differs from the packaged
    # version" e desiste. Sem ela o nginx escuta so em IPv4, e se o Traefik
    # resolver o container para o endereco IPv6 ele conecta num socket que
    # ninguem atende: a requisicao sai e a resposta nunca vem.
    listen [::]:80;
    server_name _;

    # Usa o DNS interno do Docker para resolver nomes de servico dinamicamente.
    # Evita Gateway Timeout quando o frontend sobe antes do backend.
    resolver 127.0.0.11 valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy reverso para o backend (API)
    location /db/ {
        set $upstream http://backend:3000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    location /auth/ {
        set $upstream http://backend:3000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /report/ {
        set $upstream http://backend:3000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # A API do painel e o painel em si dividem o prefixo /painel/. As duas
    # rotas da API sao `location =`, que no nginx ganha do prefixo -- assim
    # /painel/dados vai para o backend e /painel/ serve o HTML.
    location = /painel/dados {
        set $upstream http://backend:3000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /painel/saude {
        set $upstream http://backend:3000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /push/ {
        set $upstream http://backend:3000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # O painel busca este arquivo como fonte alternativa quando a API falha.
    # Sem esta regra ele cai no fallback do SPA e volta 200 com o proprio HTML
    # -- o painel entao acha que achou dado, quebra ao interpretar, e mostra
    # exemplos sem dizer por que. 404 e a resposta honesta para arquivo que
    # nao existe.
    location = /dados.json {
        try_files $uri =404;
    }

    # Vue Router (History Mode) - SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bloquear acesso a arquivos ocultos
    location ~ /\. {
        deny all;
    }
}
